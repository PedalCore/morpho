name: Deploy snn lab to Pages

on:
  push:
    branches: [snn-lab]
    paths:
      - 'snn/**'
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: snn

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # site root = landing page (site/), lab lives under /snn/
      - name: Stage site
        run: |
          mkdir -p _site/snn
          cp -r site/. _site/
          cp -r snn/. _site/snn/
      # rwkv-live.html runs the whole model in-browser; its 14.9MB int8 binary
      # lives in a release asset rather than the repo, and is staged here so the
      # page can fetch it same-origin.
      - name: Stage model weights for rwkv-live
        run: |
          mkdir -p _site/rwkv-export
          curl -sSL --retry 3 -o _site/rwkv-export/model-int8.bin \
            https://github.com/PedalCore/morpho/releases/download/spikelm-v0.1/model-int8.bin
          ls -l _site/rwkv-export/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
