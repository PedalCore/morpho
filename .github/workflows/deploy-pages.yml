name: Deploy snn lab to Pages

on:
  push:
    branches: [snn-lab]
    paths:
      - 'snn/**'
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: snn

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # site root = landing page (site/), lab lives under /snn/
      - name: Stage site
        run: |
          mkdir -p _site/snn
          cp -r site/. _site/
          cp -r snn/. _site/snn/
      # rwkv-live.html runs the whole model in-browser; its int8 binary ships
      # in the repo under site/rwkv-export/ and is copied by the step above,
      # so the page can fetch it same-origin. (Also mirrored as release asset
      # spikelm-v0.1 for anyone who wants it without cloning.)
      - name: Check model weights staged
        run: ls -l _site/rwkv-export/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
